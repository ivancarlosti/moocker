services:
  moodle:
    image: ghcr.io/ivancarlosti/moocker:latest
    container_name: moodle_app
    ports:
      - "127.0.0.1:${MOODLE_PORT}:80"
    env_file:
      - .env
    volumes:
      - ./moodledata:/var/www/moodledata
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
